[package]
name = "photowall"
version = "0.1.0"
description = "PhotoWall portable waterfall photo viewer"
authors = ["Kalyan-zitiu"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "photowall_lib"
crate-type = ["rlib"]

[[bin]]
name = "PhotoWall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
imagesize = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8"
url = "2"
walkdir = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
